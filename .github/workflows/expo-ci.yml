name: Expo CI

on:
  workflow_dispatch:
  push:
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, type-check, doctor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Lint
        run: npx expo lint

      - name: Type check
        run: npx tsc --noEmit